<main class="container">
  <h1>Minhas Tarefas (Angular 22)</h1>

  <!-- Input reativo para adicionar novas tarefas -->
  <div class="input-group">
    <input
      type="text"
      #novaTarefaInput
      placeholder="O que precisa ser feito?"
      (keyup.enter)="adicionarTarefa(novaTarefaInput.value); novaTarefaInput.value = ''"
    />
    <button (click)="adicionarTarefa(novaTarefaInput.value); novaTarefaInput.value = ''">
      Adicionar
    </button>
  </div>
  
<!-- Renderização com @for e otimização de track -->
  <ul class="task-list">
    @for (tarefa of tarefas(); track tarefa.id) {
      <li [class.completed]="tarefa.concluida">
        <span (click)="alternarStatus(tarefa.id)">
          {{ tarefa.titulo }}
        </span>
        <button class="btn-delete" (click)="removerTarefa(tarefa.id)">Remover</button>
      </li>
    } @empty {
      <!-- Bloco @empty nativo do Angular 22: elimina condicionais @if extras para arrays vazios -->
      <li class="empty-state">
        🎉 Parabéns! Nenhuma tarefa pendente na lista.
      </li>
    }
  </ul>
</main>
